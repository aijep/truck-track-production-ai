<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Logistics - Truck Tracking Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS (Free OpenStreetMap Engine) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: 100%; width: 100%; }
        .menu-drawer { transform: translateX(-100%); transition: transform 0.25s ease; }
        .menu-drawer.open { transform: translateX(0); }
        .tab-btn.active { color: #60a5fa; border-color: #60a5fa; }
        input[type="text"], input[type="datetime-local"], select {
            background-color: #1f2937; border: 1px solid #374151; border-radius: 0.375rem;
            padding: 0.4rem 0.6rem; font-size: 0.8rem; width: 100%; color: white;
        }
        label { font-size: 0.7rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.03em; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-96 bg-gray-800 border-r border-gray-700 flex flex-col z-10 shadow-lg relative">
        <div class="p-4 border-b border-gray-700 flex items-start justify-between">
            <div>
                <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                    <span>🚛</span> Truck Tracker Admin
                </h1>
                <p class="text-xs text-gray-400 mt-1">Free OpenStreetMap Engine</p>
            </div>
            <button id="menu-toggle-btn" title="Add driver, truck or allotment"
                class="mt-1 p-2 rounded-lg bg-gray-700 hover:bg-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <div class="px-4 py-2 bg-gray-750 flex items-center justify-between text-xs border-b border-gray-700">
            <span class="text-gray-400">WebSocket Link:</span>
            <span id="ws-status" class="px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-400 font-semibold">Connecting...</span>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="truck-list">
            <div id="no-trucks" class="text-center text-gray-500 py-8 text-sm">
                Waiting for live truck coordinates...
            </div>
        </div>

        <div class="h-48 border-t border-gray-700 bg-gray-900 p-3 flex flex-col">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">WhatsApp Webhook Events</h2>
            <div id="logs" class="flex-1 overflow-y-auto text-xs font-mono space-y-1 text-gray-300">
                <div class="text-gray-600 italic">[System] Listening for receipts...</div>
            </div>
        </div>

        <!-- Slide-in Management Drawer -->
        <div id="menu-drawer" class="menu-drawer absolute inset-0 bg-gray-800 z-20 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                <h2 class="font-bold text-blue-400">Add Details</h2>
                <button id="menu-close-btn" class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-gray-700 text-xs font-semibold">
                <button class="tab-btn active flex-1 py-2 border-b-2 border-transparent" data-tab="driver">Driver</button>
                <button class="tab-btn flex-1 py-2 border-b-2 border-transparent" data-tab="truck">Truck</button>
                <button class="tab-btn flex-1 py-2 border-b-2 border-transparent" data-tab="allotment">Allotment</button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4">

                <!-- Driver Form -->
                <form id="driver-form" class="tab-panel space-y-3" data-panel="driver">
                    <div>
                        <label>Driver Name</label>
                        <input type="text" id="driver-name" required placeholder="e.g. Rajesh Kumar">
                    </div>
                    <div>
                        <label>Phone Number</label>
                        <input type="text" id="driver-phone" required placeholder="e.g. +91 9876543210">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-sm font-semibold py-2 rounded-lg">Save Driver</button>
                    <div id="driver-msg" class="text-xs"></div>
                </form>

                <!-- Truck Form -->
                <form id="truck-form" class="tab-panel space-y-3 hidden" data-panel="truck">
                    <div>
                        <label>Truck Plate Number</label>
                        <input type="text" id="truck-plate" required placeholder="e.g. AS01AB1234">
                    </div>
                    <div>
                        <label>Truck Model</label>
                        <input type="text" id="truck-model" required placeholder="e.g. Tata 1613">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-sm font-semibold py-2 rounded-lg">Save Truck</button>
                    <div id="truck-msg" class="text-xs"></div>
                </form>

                <!-- Allotment Form -->
                <form id="allotment-form" class="tab-panel space-y-3 hidden" data-panel="allotment">
                    <div>
                        <label>Driver</label>
                        <select id="allotment-driver" required></select>
                    </div>
                    <div>
                        <label>Truck</label>
                        <select id="allotment-truck" required></select>
                    </div>
                    <div>
                        <label>Source</label>
                        <input type="text" id="allotment-source" required placeholder="e.g. Guwahati, Assam">
                    </div>
                    <div>
                        <label>Destination</label>
                        <input type="text" id="allotment-destination" required placeholder="e.g. Kolkata, West Bengal">
                    </div>
                    <div>
                        <label>Start Time</label>
                        <input type="datetime-local" id="allotment-start" step="1" required>
                    </div>
                    <div>
                        <label>Reached Time (optional)</label>
                        <input type="datetime-local" id="allotment-reached" step="1">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-sm font-semibold py-2 rounded-lg">
                        Save Allotment &amp; Draw Route
                    </button>
                    <div id="allotment-msg" class="text-xs"></div>
                </form>

            </div>
        </div>
    </aside>

    <!-- Map Canvas -->
    <main class="flex-1 relative bg-gray-950">
        <div id="map"></div>
    </main>

    <script>
        let map;
        const markers = {};

        // Initialize OpenStreetMap via Leaflet
        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5); // Default view

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        // Establish WebSocket Connection
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/dashboard`;
        const socket = new WebSocket(wsUrl);

        const statusBadge = document.getElementById("ws-status");
        const truckList = document.getElementById("truck-list");
        const logsContainer = document.getElementById("logs");

        socket.onopen = () => {
            statusBadge.textContent = "Live";
            statusBadge.className = "px-2 py-0.5 rounded-full bg-green-500/20 text-green-400 font-semibold";
            logEvent("WebSocket connected.");
        };

        socket.onclose = () => {
            statusBadge.textContent = "Disconnected";
            statusBadge.className = "px-2 py-0.5 rounded-full bg-red-500/20 text-red-400 font-semibold";
            logEvent("WebSocket closed.");
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "location_update") {
                updateTruckMarker(data);
            } else if (data.type === "whatsapp_status") {
                logEvent(`WA Msg ${data.message_id}: ${data.status.toUpperCase()}`);
            }
        };

        function updateTruckMarker(data) {
            const { consignment_id, lat, lng, driver_name } = data;
            const latitude = parseFloat(lat);
            const longitude = parseFloat(lng);

            const noTrucksEl = document.getElementById("no-trucks");
            if (noTrucksEl) noTrucksEl.remove();

            if (markers[consignment_id]) {
                markers[consignment_id].setLatLng([latitude, longitude]);
            } else {
                markers[consignment_id] = L.marker([latitude, longitude])
                    .addTo(map)
                    .bindPopup(`<b>Driver: ${driver_name || consignment_id}</b><br>ID: ${consignment_id}`);
                
                map.setView([latitude, longitude], 13);
            }

            let card = document.getElementById(`truck-card-${consignment_id}`);
            if (!card) {
                card = document.createElement("div");
                card.id = `truck-card-${consignment_id}`;
                card.className = "p-3 bg-gray-750 border border-gray-700 rounded-lg cursor-pointer hover:border-blue-500";
                card.onclick = () => map.setView([latitude, longitude], 14);
                truckList.appendChild(card);
            }

            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="font-bold text-sm text-blue-300">ID: ${consignment_id}</span>
                    <span class="text-xs bg-green-500/20 text-green-400 px-1.5 py-0.5 rounded">Active</span>
                </div>
                <div class="text-xs text-gray-300 mt-1">Driver: ${driver_name || 'Assigned Driver'}</div>
                <div class="text-xs text-gray-500 mt-0.5 font-mono">Lat: ${latitude.toFixed(4)}, Lng: ${longitude.toFixed(4)}</div>
            `;
        }

        function logEvent(message) {
            const entry = document.createElement("div");
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        // ---------------------------------------------------------------
        // Slide-in Management Drawer (Driver / Truck / Allotment)
        // ---------------------------------------------------------------
        const drawer = document.getElementById("menu-drawer");
        const menuToggleBtn = document.getElementById("menu-toggle-btn");
        const menuCloseBtn = document.getElementById("menu-close-btn");
        let routeLayer = null;
        let routeMarkers = [];

        menuToggleBtn.addEventListener("click", () => {
            drawer.classList.add("open");
            refreshDriverTruckSelects();
        });
        menuCloseBtn.addEventListener("click", () => drawer.classList.remove("open"));

        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
                document.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).classList.remove("hidden");
            });
        });

        // Format a datetime-local value ("YYYY-MM-DDTHH:MM:SS") into "HH:MM:SS DD/MM/YYYY"
        function formatDisplayTime(value) {
            if (!value) return null;
            const [datePart, timePart] = value.split("T");
            const [yyyy, mm, dd] = datePart.split("-");
            const time = timePart && timePart.length === 5 ? `${timePart}:00` : timePart;
            return `${time} ${dd}/${mm}/${yyyy}`;
        }

        // ---- Driver form ----
        document.getElementById("driver-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("driver-msg");
            msg.textContent = "Saving...";
            msg.className = "text-xs text-gray-400";
            try {
                const res = await fetch("/api/drivers", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: document.getElementById("driver-name").value,
                        phone: document.getElementById("driver-phone").value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Failed to save driver");
                msg.textContent = "Driver saved.";
                msg.className = "text-xs text-green-400";
                e.target.reset();
                refreshDriverTruckSelects();
            } catch (err) {
                msg.textContent = err.message;
                msg.className = "text-xs text-red-400";
            }
        });

        // ---- Truck form ----
        document.getElementById("truck-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("truck-msg");
            msg.textContent = "Saving...";
            msg.className = "text-xs text-gray-400";
            try {
                const res = await fetch("/api/trucks", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        plate_number: document.getElementById("truck-plate").value,
                        model: document.getElementById("truck-model").value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Failed to save truck");
                msg.textContent = "Truck saved.";
                msg.className = "text-xs text-green-400";
                e.target.reset();
                refreshDriverTruckSelects();
            } catch (err) {
                msg.textContent = err.message;
                msg.className = "text-xs text-red-400";
            }
        });

        // Populate driver / truck dropdowns for the allotment form
        async function refreshDriverTruckSelects() {
            try {
                const [drivers, trucks] = await Promise.all([
                    fetch("/api/drivers").then(r => r.json()),
                    fetch("/api/trucks").then(r => r.json())
                ]);
                const driverSelect = document.getElementById("allotment-driver");
                const truckSelect = document.getElementById("allotment-truck");
                driverSelect.innerHTML = drivers.length
                    ? drivers.map(d => `<option value="${d.id}">${d.name} (${d.phone})</option>`).join("")
                    : `<option value="">No drivers yet</option>`;
                truckSelect.innerHTML = trucks.length
                    ? trucks.map(t => `<option value="${t.id}">${t.plate_number} - ${t.model}</option>`).join("")
                    : `<option value="">No trucks yet</option>`;
            } catch (err) {
                console.error("Could not load drivers/trucks", err);
            }
        }

        // Geocode a place name using the free OSM Nominatim API
        async function geocode(place) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(place)}`;
            const res = await fetch(url, { headers: { "Accept": "application/json" } });
            const results = await res.json();
            if (!results.length) throw new Error(`Could not locate "${place}"`);
            return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
        }

        // Draw a route between two coordinates using the free OSRM demo routing server
        async function drawRoute(source, dest) {
            // Clear any previous route
            if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
            routeMarkers.forEach(m => map.removeLayer(m));
            routeMarkers = [];

            const srcMarker = L.marker([source.lat, source.lng], {
                icon: L.divIcon({ className: '', html: '🟢', iconSize: [20, 20] })
            }).addTo(map).bindPopup("Source");
            const destMarker = L.marker([dest.lat, dest.lng], {
                icon: L.divIcon({ className: '', html: '🔴', iconSize: [20, 20] })
            }).addTo(map).bindPopup("Destination");
            routeMarkers.push(srcMarker, destMarker);

            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${source.lng},${source.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes.length) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    routeLayer = L.polyline(coords, { color: "#3b82f6", weight: 4 }).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
                    return;
                }
                throw new Error("No route found");
            } catch (err) {
                // Fall back to a straight line if the routing service is unavailable
                routeLayer = L.polyline([[source.lat, source.lng], [dest.lat, dest.lng]], {
                    color: "#3b82f6", weight: 3, dashArray: "6 6"
                }).addTo(map);
                map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
            }
        }

        // ---- Allotment form ----
        document.getElementById("allotment-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("allotment-msg");
            msg.textContent = "Locating source & destination...";
            msg.className = "text-xs text-gray-400";

            const sourceText = document.getElementById("allotment-source").value;
            const destText = document.getElementById("allotment-destination").value;

            try {
                const [source, dest] = await Promise.all([geocode(sourceText), geocode(destText)]);

                msg.textContent = "Drawing route...";
                await drawRoute(source, dest);

                msg.textContent = "Saving allotment...";
                const res = await fetch("/api/allotments", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        driver_id: parseInt(document.getElementById("allotment-driver").value),
                        truck_id: parseInt(document.getElementById("allotment-truck").value),
                        source: sourceText,
                        destination: destText,
                        source_lat: source.lat,
                        source_lng: source.lng,
                        dest_lat: dest.lat,
                        dest_lng: dest.lng,
                        start_time: formatDisplayTime(document.getElementById("allotment-start").value),
                        reached_time: formatDisplayTime(document.getElementById("allotment-reached").value)
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Failed to save allotment");

                msg.textContent = "Allotment saved & route drawn.";
                msg.className = "text-xs text-green-400";
                drawer.classList.remove("open");
            } catch (err) {
                msg.textContent = err.message;
                msg.className = "text-xs text-red-400";
            }
        });

        window.onload = initMap;
    </script>
</body>
</html>
